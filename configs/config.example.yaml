env: prod
debug: false
source: file

http:
  address:
    - "0.0.0.0:8443"

db:
  driver: mysql
  dsn: "server:server@tcp(127.0.0.1:3306)/server?charset=utf8mb4&parseTime=True&loc=Local&interpolateParams=true"
  debug: false
  prepareStmt: false
  # 连接池必须显式配：cago 的零值表示不设置，会退回 database/sql 的默认值——空闲
  # 上限 2、连接数无上限、连接永不过期。maxOpenConns 是每个副本的上限，多副本时
  # 先算「副本数 x maxOpenConns <= MySQL 的 max_connections」（默认只有 151）。
  maxOpenConns: 40
  maxIdleConns: 20
  connMaxLifetime: 30m
  connMaxIdleTime: 5m

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

logger:
  level: info
  disableConsole: false
  logFile:
    enable: true
    filename: ./runtime/logs/server.log
    errorFilename: ./runtime/logs/server.err.log

# type=empty 不上报 collector，但仍生成 trace_id/span_id 供日志关联；接上
# collector 后改成 grpc/http 并填 endpoint。详见 docs/observability.md#traces
trace:
  type: empty
  sample: 1
  endpoint: ""
  useSSL: false

# 指标无需配置：注册 metric 组件即自动暴露 GET /metrics。详见 docs/observability.md#metrics

server:
  public_url: "https://server.agentre.dev"
  insecure_cookies: false
  session:
    cookie_name: "server_session"
    ttl: 336h
  device_flow:
    user_code_ttl: 10m
    poll_interval: 5s
  jwt:
    active_kid: "2026-08-a"
    keys:
      - kid: "2026-08-a"
        private_key_pem_path: "/etc/agentre-server/keys/2026-08-a.key"
        public_key_pem_path: "/etc/agentre-server/keys/2026-08-a.pub"
    issuer:   "agentre-server"
    audience: "agentre"
    access_ttl: 15m
    refresh_ttl: 2160h
  oauth:
    github:
      client_id:     ""
      client_secret: ""
      callback_path: "/v1/auth/oauth/github/callback"
  rate_limit:
    authorize_per_ip_per_min: 3
    github_authorize_per_ip_per_min: 10
    github_callback_per_ip_per_min: 10
    # 注册要求已登录，同一账号换个出口就绕开了 IP 那道，所以按 IP 和按账号各一道。
    passkey_register_begin_per_ip_per_min: 10
    passkey_register_begin_per_account_per_min: 10
    # 登录时还没有账号可按，只能按 IP；计数前缀与注册分开，登录洪水锁不死注册。
    passkey_login_begin_per_ip_per_min: 10
  # 判定结论按 user_id 缓存的时长，即「改库封禁后多久在所有入口失效」的上界。
  account_gate:
    cache_ttl: 60s
  # rp_id 与 origins 留空则由 public_url 推导。前后端不同端口时（本地前端 5174、
  # 后端 8443）必须显式列全浏览器真正发出的 origin，否则校验过不去；rp_id 只能是
  # 有效域名，不带 scheme、不带端口。
  webauthn:
    rp_id: "server.agentre.dev"
    rp_name: "AgentRe"
    origins:
      - "https://server.agentre.dev"
    # 每账号能注册多少把。超出时注册端点明确拒绝，不是静默忽略。
    max_per_account: 10
  # 控制台的 latest 来源：定时拉上游发布版本写进 Redis，/v1/release/latest 只读缓存。
  # 缺省关闭——内网部署未必连得到上游，关掉时端点如实回「不知道」，不伪装成「已是最新」。
  release:
    enabled: false
    # 留空则问 GitHub 的 releases/latest API；内网镜像的形状需与该 API 一致。
    base_url: ""
    # 过期让端点从旧值自然退回「不知道」，而不是无限期回答一个早已过时的版本号。
    cache_ttl: 1h
