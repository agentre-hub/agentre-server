# 小写。cago 用 env != "prod" 决定要不要挂 /swagger（pkg/component/core.go），
# 写成大写 PROD 那个判断永远成立，swagger 就被暴露出去了。
env: prod
debug: false

# 配置源。留 file 表示就读这个文件；k8s 上由 ConfigMap 覆盖成 etcd。
# 这一行不能省：cago 读不到某个键时会把默认值**写回配置文件**
# （cago configs/file/file.go 的 fileSource.Scan），配置文件只读时就直接启动失败。
# 镜像里这份是 root 拥有、容器以 nonroot 跑，缺 source 就是 "permission denied"。
source: file

http:
  address:
    - "0.0.0.0:8443"

db:
  driver: postgres
  dsn: "postgres://server:server@127.0.0.1:5432/server?sslmode=disable"
  debug: false
  prepareStmt: false

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

logger:
  level: info
  disableConsole: false
  logFile:
    enable: true
    filename: ./runtime/logs/server.log
    errorFilename: ./runtime/logs/server.err.log

# 链路追踪。type=empty 表示不往 collector 上报，但仍生成有效的
# trace_id/span_id——日志里照样能关联一次请求，本地开发不需要起 Jaeger。
# 接了 collector 之后改成 grpc/http 并填 endpoint、把 sample 调上去。
# 详见 docs/observability.md#traces
trace:
  type: empty
  sample: 1
  endpoint: ""
  useSSL: false

# 指标不需要额外配置：注册 metric 组件后自动暴露 GET /metrics 供 Prometheus 抓取。
# 详见 docs/observability.md#metrics

server:
  public_url: "https://server.agentre.dev"
  insecure_cookies: false
  session:
    cookie_name: "server_session"
    ttl: 336h
  device_flow:
    user_code_ttl: 10m
    poll_interval: 5s
  jwt:
    private_key_pem_path: "/etc/agentre-server/jwt.key"
    public_key_pem_path:  "/etc/agentre-server/jwt.pub"
    issuer:   "agentre-server"
    audience: "agentre"
    access_ttl: 1h
    refresh_ttl: 2160h
  oauth:
    github:
      client_id:     ""
      client_secret: ""
      callback_path: "/v1/auth/oauth/github/callback"
  rate_limit:
    authorize_per_ip_per_min: 3
