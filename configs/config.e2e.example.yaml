# Copy to configs/config.e2e.yaml. The copied file is gitignored.
# Keep source=file: the E2E runner must be able to inspect the exact configuration
# passed to `bin/server --config` before it touches a dedicated test database.
env: test
debug: false
source: file

http:
  # Use a loopback-only, E2E-exclusive port. The runner refuses to reuse a process
  # already listening here.
  address:
    - "127.0.0.1:18443"

db:
  driver: mysql
  # Placeholder credentials only. The database name must contain an e2e marker;
  # the runner never creates, drops, renames, or truncates this database.
  dsn: "e2e_user:e2e_password@tcp(127.0.0.1:3306)/agentre_e2e?charset=utf8mb4&parseTime=True&loc=Local&interpolateParams=true"
  debug: false
  prepareStmt: false
  # Connection pool. Every field defaults to zero in cago, meaning "leave
  # database/sql alone" — and those defaults are wrong for a server (idle cap of
  # 2, unbounded connections, connections that never expire), so set them here.
  maxOpenConns: 40
  maxIdleConns: 20
  connMaxLifetime: 30m
  connMaxIdleTime: 5m

redis:
  addr: "127.0.0.1:6379"
  password: ""
  # Prefer a Redis DB reserved for E2E. Cleanup only deletes this run's keys.
  db: 9

logger:
  level: info
  disableConsole: false
  logFile:
    enable: false

trace:
  type: empty
  sample: 1
  endpoint: ""
  useSSL: false

server:
  public_url: "http://127.0.0.1:18443"
  insecure_cookies: true
  session:
    cookie_name: "server_session"
    ttl: 336h
  device_flow:
    user_code_ttl: 10m
    poll_interval: 1s
  jwt:
    active_kid: "e2e-local"
    keys:
      - kid: "e2e-local"
        # Generate local test keys outside tracked files, for example under
        # runtime/keys/, then put absolute paths in configs/config.e2e.yaml.
        private_key_pem_path: "/absolute/path/to/local/e2e-jwt.key"
        public_key_pem_path: "/absolute/path/to/local/e2e-jwt.pub"
    issuer: "agentre-server"
    audience: "agentre"
    access_ttl: 15m
    refresh_ttl: 2160h
  oauth:
    github:
      client_id: ""
      client_secret: ""
      callback_path: "/v1/auth/oauth/github/callback"
  rate_limit:
    authorize_per_ip_per_min: 30
    github_authorize_per_ip_per_min: 100
    github_callback_per_ip_per_min: 100
    passkey_register_begin_per_ip_per_min: 100
    passkey_register_begin_per_account_per_min: 100
    passkey_login_begin_per_ip_per_min: 100
  # Account gate: how long a verdict (usable / banned / missing) stays cached in Redis
  # per user_id — the observable upper bound for a ban applied straight in the database.
  account_gate:
    cache_ttl: 60s
  # Passkeys (WebAuthn). Browsers refuse WebAuthn on an IP origin, so the E2E browser
  # must reach the server through localhost even though public_url uses 127.0.0.1.
  # Both spellings are listed so switching either one does not silently break origin
  # validation. rp_id is a bare domain: no scheme, no port.
  webauthn:
    rp_id: "localhost"
    rp_name: "AgentRe E2E"
    origins:
      - "http://localhost:18443"
      - "http://127.0.0.1:18443"
    max_per_account: 10
