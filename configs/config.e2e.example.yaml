# Copy to configs/config.e2e.yaml (gitignored). Keep source=file: the runner
# inspects the exact config passed to `bin/server --config` before touching a database.
env: test
debug: false
source: file

http:
  # Loopback-only, E2E-exclusive port. The runner refuses to reuse a process already here.
  address:
    - "127.0.0.1:18443"

db:
  driver: mysql
  # Placeholder credentials. The database name must carry an e2e marker; the runner
  # never creates, drops, renames, or truncates this database.
  dsn: "e2e_user:e2e_password@tcp(127.0.0.1:3306)/agentre_e2e?charset=utf8mb4&parseTime=True&loc=Local&interpolateParams=true"
  debug: false
  prepareStmt: false
  # Pool settings must be explicit: a zero in cago means "don't set", which leaves the
  # database/sql defaults — idle cap 2, unbounded connections, connections never expire.
  maxOpenConns: 40
  maxIdleConns: 20
  connMaxLifetime: 30m
  connMaxIdleTime: 5m

redis:
  addr: "127.0.0.1:6379"
  password: ""
  # Prefer a Redis DB reserved for E2E. Cleanup only deletes this run's keys.
  db: 9

logger:
  level: info
  disableConsole: false
  logFile:
    enable: false

trace:
  type: empty
  sample: 1
  endpoint: ""
  useSSL: false

server:
  public_url: "http://127.0.0.1:18443"
  session:
    ttl: 336h
  device_flow:
    user_code_ttl: 10m
    poll_interval: 1s
  jwt:
    active_kid: "e2e-local"
    keys:
      - kid: "e2e-local"
        # Generate test keys outside tracked files (e.g. runtime/keys/) and use
        # absolute paths here.
        private_key_pem_path: "/absolute/path/to/local/e2e-jwt.key"
        public_key_pem_path: "/absolute/path/to/local/e2e-jwt.pub"
    access_ttl: 15m
    refresh_ttl: 2160h
  oauth:
    github:
      client_id: ""
      client_secret: ""
  rate_limit:
    authorize_per_ip_per_min: 30
    github_authorize_per_ip_per_min: 100
    github_callback_per_ip_per_min: 100
    passkey_register_begin_per_ip_per_min: 100
    passkey_register_begin_per_account_per_min: 100
    passkey_login_begin_per_ip_per_min: 100
  # How long a verdict stays cached per user_id — the observable upper bound for a
  # ban applied straight in the database.
  account_gate:
    cache_ttl: 60s
  # Browsers refuse WebAuthn on an IP origin, so the browser must reach the server
  # through localhost even though public_url uses 127.0.0.1; both spellings are listed
  # so switching either one does not silently break origin validation. rp_id is a bare
  # domain: no scheme, no port.
  webauthn:
    rp_id: "localhost"
    rp_name: "AgentRe E2E"
    origins:
      - "http://localhost:18443"
      - "http://127.0.0.1:18443"
    max_per_account: 10
