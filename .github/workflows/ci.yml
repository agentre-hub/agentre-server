name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧 run 直接取消，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  # 与本地 `make lint` 完全同一条命令：golangci-lint v2 + 前端 eslint。
  # 命令写在 Makefile 里，CI 只负责调用——不要在这里另写一份，
  # 否则会出现「本地绿 CI 红」而没人知道为什么。
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout 10m

      # eslint（含 prettier/prettier 格式检查）
      - name: frontend eslint
        run: make lint-frontend

      # e2e 只有 prettier
      - name: e2e prettier
        run: make lint-e2e

  # 与本地 `make test` 完全同一条命令。本仓库没有任何 build tag，
  # 所以这里跑到的就是全部——见 internal/pkg/jwt/testkeys/isolation_test.go。
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: make test
        run: make test

  # 冒烟 e2e：桌面 + 移动两个 project，API 全 mock，不需要 PG/Redis。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile

      - name: make test-e2e
        run: make test-e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # 确认 embed 链路没坏：前端 build → 拷进 internal/web/dist → go build。
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: make build
        run: make build
