services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agentre_e2e_ci
      MYSQL_USER: agentre_e2e
      MYSQL_PASSWORD: agentre_e2e
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60
