{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "agentre-server.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "agentre-server.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.sectionNames }}
    - name: {{ $.Values.httpRoute.gateway.name }}
      namespace: {{ $.Values.httpRoute.gateway.namespace }}
      sectionName: {{ . }}
    {{- end }}
  hostnames:
    - {{ .Values.httpRoute.host | quote }}
    {{- with .Values.httpRoute.forwardHost }}
    # 端口转发子域：同一个服务，按 Host 分发在进程里做（internal/api/router.go）
    - {{ . | quote }}
    {{- end }}
  rules:
    # 同一个二进制既发 SPA 又发 /v1，只要一条根规则
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
{{- end }}
