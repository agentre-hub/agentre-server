apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentre-server.fullname" . }}
  labels:
    {{- include "agentre-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentre-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # 引导配置变了就滚一次，否则改 etcd 地址要等下次发版才生效
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agentre-server.selectorLabels" . | nindent 8 }}
        app.cago.io/environment: {{ .Values.appConfig.env | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentre-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # HTTP 是最后启动的，迁移跑完前端口拒连。没有 startupProbe 的话
          # 存活探针会在迁移中途把 Pod 杀掉，变成起不来的循环。
          startupProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # 该端点在 DB/Redis 不通时仍返回 200，只把 db_ping/redis 置 false，
          # 所以就绪探针不会被下游抖动带下线
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "agentre-server.fullname" . }}
            items:
              - key: config.yaml
                path: config.yaml
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
