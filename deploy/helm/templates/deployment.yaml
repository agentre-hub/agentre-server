apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentre-server.fullname" . }}
  labels:
    {{- include "agentre-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentre-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # 引导配置变了就滚一次，否则改 etcd 地址要等下次发版才生效
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agentre-server.selectorLabels" . | nindent 8 }}
        app.cago.io/environment: {{ .Values.appConfig.env | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentre-server.serviceAccountName" . }}
      # 中继是长连接，硬断和优雅让位对客户端完全不是一回事，所以停机分两拍：
      #
      #   1. preStop 先睡一会儿。SIGTERM 与「把 Pod 从 Service endpoints 里摘掉」
      #      是**并行**发生的，摘除要经 kube-proxy / ingress 逐跳传播。不等这一下
      #      就排空，客户端立刻重连，很可能又被路由回这个正在退出的 Pod。
      #   2. 睡醒后才是 SIGTERM → cago 逆序关组件 → task.RelayDrain 给每条中继写
      #      一个 1001(Going Away) 再关 → 客户端认出「服务端要走了」，退避清零、
      #      立刻重连，这次落到别的副本上（见 relaytransport.ErrRelayGoingAway）。
      #
      # 宽限期必须大于 preStop + 排空，否则第 2 拍还没跑完就被 SIGKILL，等于没做。
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # 迁移跑完前端口是拒连的，没有这个探针存活探针会中途把 Pod 杀掉；
          # 并发启动时还要先等迁移锁（预算 120s），60 * 5s = 300s 给「等锁 + 迁移」留够余量
          startupProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          # 该端点在 DB/Redis 不通时仍返回 200，所以不会被下游抖动带下线
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.preStopDrainDelaySeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "agentre-server.fullname" . }}
            items:
              - key: config.yaml
                path: config.yaml
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
