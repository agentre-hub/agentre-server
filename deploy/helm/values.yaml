# 环境相关的值由 .gitea/workflows/deploy.yaml 在 helm upgrade 时 --set 覆盖，
# 这里的默认值对应生产。

replicaCount: 1

image:
  repository: agentre-hub/agentre-server
  pullPolicy: IfNotPresent
  # 留空回落到 Chart.appVersion；流水线一律传 <env>.<短 commit>
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# 引导配置。渲染进 ConfigMap 挂到 /app/configs/config.yaml，业务配置全部在 etcd。
appConfig:
  # 必须小写：cago 用 env != "prod" 决定要不要挂 /swagger
  env: prod
  debug: false

etcdConfig:
  endpoints:
    - etcd-config.core.svc.cluster.local:2379
  prefix: /config
  username: root
  # 由流水线从 secrets 传入
  password: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

# 服务不写盘（日志只走 stdout），所以根文件系统可以只读
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

# 与 etcd 里 http.address 的端口保持一致
containerPort: 8443

ingress:
  enabled: true
  className: k3s-main-nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  # host 与 tlsSecretName 是标量不是列表：helm 的 --set 打到列表下标是替换整个元素，
  # 用列表的话 --set ingress.tls[0].hosts[0]=... 会把 secretName 冲成空。
  host: app.agentrehub.com
  # 置空则不生成 TLS 块
  tlsSecretName: agentrehub-com-tls

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
