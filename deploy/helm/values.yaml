# 默认值对应生产，环境相关的由流水线 --set 覆盖

replicaCount: 1

image:
  repository: agentre-hub/agentre-server
  pullPolicy: IfNotPresent
  # 留空回落到 Chart.appVersion；流水线一律传 <env>.<短 commit>
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# 引导配置，业务配置全部在 etcd
appConfig:
  # 必须小写，大写会把 /swagger 暴露出去
  env: prod
  debug: false

etcdConfig:
  endpoints:
    - etcd-config.core.svc.cluster.local:2379
  prefix: /config
  username: root
  # 由流水线从 secrets 传入
  password: ""

podAnnotations: {}

podSecurityContext: {}

# 服务不写盘（日志只走 stdout），所以根文件系统可以只读
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

# 与 etcd 里 http.address 的端口保持一致
containerPort: 8443

# Gateway API 路由：挂到 gateway 命名空间的 Gateway public（由 codfrm/k3s-deployment 的 gateway/ 管理）
# 证书在网关上按 SNI 选（gateway 命名空间的 agentrehub-com-tls / fw-agentrehub-com-tls），chart 不再引用证书。
# HSTS（max-age=31536000; includeSubDomains）由网关全局下发，端口转发子域加固依赖它。
# 超时：网关 entryPoint 不限读超时、空闲 600s，覆盖原来 nginx 的 3600s 读写超时。
httpRoute:
  enabled: true
  gateway:
    name: public
    namespace: gateway
  # 同时挂 http 和 https：Cloudflare Flexible 用 HTTP 回源 80，
  # 直接访问 http 的请求由网关按 X-Forwarded-Proto 统一 301 到 https
  sectionNames:
    - http
    - https
  # 标量不是列表：--set 打到列表下标会替换整个元素
  host: app.agentrehub.com
  # 端口转发子域（spec 2026-09-21-port-forward-subdomain 决策 4）：通配 host（通配证书和通配 DNS 是部署前提）。
  # 与 etcd 里的 server.port_forward.base_domain 成对：host 是 "*." + base_domain。
  # 置空则不挂转发域。例：forwardHost: "*.fw.agentrehub.com"
  forwardHost: ""

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

# 优雅停机（见 deployment.yaml 里那段说明）。两个数是一组：
# terminationGracePeriodSeconds 必须明显大于 preStopDrainDelaySeconds，剩下的差额
# 留给排空本身与 cago 收尾（镜像租约让出、cron 停摆）。
preStopDrainDelaySeconds: 10
terminationGracePeriodSeconds: 45

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
