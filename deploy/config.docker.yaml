# compose 用的配置，挂到容器的 /app/configs/config.yaml
env: prod
debug: false
source: file

http:
  address:
    - "0.0.0.0:8443"

db:
  driver: mysql
  dsn: "server:server@tcp(mysql:3306)/server?charset=utf8mb4&parseTime=True&loc=Local&interpolateParams=true"
  debug: false
  prepareStmt: false
  # 连接池必须显式配：cago 的零值表示不设置，会退回 database/sql 的默认值——空闲
  # 上限 2、连接数无上限、连接永不过期。maxOpenConns 是每个副本的上限，多副本时
  # 先算「副本数 x maxOpenConns <= MySQL 的 max_connections」（默认只有 151）。
  maxOpenConns: 40
  maxIdleConns: 20
  connMaxLifetime: 30m
  connMaxIdleTime: 5m

redis:
  addr: "redis:6379"
  password: ""
  db: 0

logger:
  level: info
  disableConsole: false
  logFile:
    enable: false

trace:
  type: empty
  sample: 1
  endpoint: ""
  useSSL: false

server:
  # 走 http，所以 Cookie 不带 Secure、通行密钥的 rp_id 是 localhost——两者都由这一行
  # 推出来，换域名只改它（或 SERVER_PUBLIC_URL）。
  public_url: "http://localhost:8443"
  session:
    ttl: 336h
  device_flow:
    user_code_ttl: 10m
    poll_interval: 5s
  jwt:
    active_kid: "local-1"
    keys:
      - kid: "local-1"
        private_key_pem_path: "/keys/jwt.key"
        public_key_pem_path: "/keys/jwt.pub"
    access_ttl: 15m
    refresh_ttl: 2160h
  oauth:
    github:
      client_id: ""
      client_secret: ""
  rate_limit:
    authorize_per_ip_per_min: 3
    # 计数前缀与设备流的 authorize 分开；authorize 每次都会往 Redis 写一条 state。
    github_authorize_per_ip_per_min: 10
    github_callback_per_ip_per_min: 10
    # 注册要求已登录，同一账号换个出口就绕开了 IP 那道，所以按 IP 和按账号各一道。
    passkey_register_begin_per_ip_per_min: 10
    passkey_register_begin_per_account_per_min: 10
    # 登录时还没有账号可按，只能按 IP；计数前缀与注册分开。
    passkey_login_begin_per_ip_per_min: 10
  # 判定结论按 user_id 缓存的时长，即「改库封禁后多久在所有入口失效」的上界。
  account_gate:
    cache_ttl: 60s
  # rp_id 与 origins 留空，由 public_url 推导；换域名只改 SERVER_PUBLIC_URL。
  # 要列多个 origin（前后端分端口之类）才显式写回来。
  webauthn:
    rp_name: "AgentRe"
    max_per_account: 10
