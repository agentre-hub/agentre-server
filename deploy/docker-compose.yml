# 路径都相对本文件所在目录。从仓库根跑：
#   docker compose -f deploy/docker-compose.yml up -d
services:
  server:
    image: agentre/server:0.1
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports: ["8443:8443"]
    volumes:
      - ./config.docker.yaml:/app/configs/config.yaml:ro
      - ../runtime/keys:/keys:ro
    environment:
      # 只有这几个 AGENTRE_SERVER_* 会被读取，其余配置走上面挂进去的文件
      AGENTRE_SERVER_PUBLIC_URL: "${SERVER_PUBLIC_URL:-http://localhost:8443}"
      AGENTRE_SERVER_OAUTH_GITHUB_CLIENT_ID: "${GH_CLIENT_ID:-}"
      AGENTRE_SERVER_OAUTH_GITHUB_CLIENT_SECRET: "${GH_CLIENT_SECRET:-}"
      AGENTRE_SERVER_SESSION_SECRET: "${SESSION_SECRET:-}"
    depends_on:
      pg:    { condition: service_healthy }
      redis: { condition: service_started }

  pg:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: server
      POSTGRES_DB: server
    # PostgreSQL 18 按大版本保存数据，挂父目录才能支持后续 pg_upgrade。
    volumes: ["../data/pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "server"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: ["../data/redis:/data"]
